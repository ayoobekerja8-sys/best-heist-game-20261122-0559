<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>VAULTLIGHT — The Meridian Gallery Job</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070b;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #wrap {
        position: relative;
        width: min(100vw, 160vh);
        height: min(62.5vw, 100vh);
        aspect-ratio: 1280 / 800;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #06080d;
        image-rendering: auto;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #e6f0ff;
      }
      #hud-top {
        position: absolute;
        left: 1.4%;
        right: 1.4%;
        top: 1.8%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      #hud-status {
        display: flex;
        gap: 6px;
        align-items: stretch;
        min-width: 0;
      }
      #hud-chips {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: nowrap;
        min-width: 0;
      }
      .hud-chip {
        background: rgba(8, 10, 16, 0.86);
        border: 1px solid rgba(120, 140, 170, 0.38);
        border-radius: 8px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #9fb4cc;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .hud-chip b {
        color: #e6f0ff;
        font-weight: 800;
        margin-left: 4px;
      }
      .hud-chip-star b {
        color: #7dffb0;
      }
      .hud-panel {
        background: rgba(8, 10, 16, 0.86);
        border: 1px solid rgba(120, 140, 170, 0.38);
        border-radius: 9px;
        padding: 5px 9px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-width: 0;
      }
      .hud-label {
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: #9fb4cc;
        font-weight: 700;
        white-space: nowrap;
      }
      .hud-alarm {
        flex: 1 1 26%;
      }
      .hud-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .hud-value {
        font-size: 12px;
        font-weight: 700;
        color: #e6f0ff;
        white-space: nowrap;
      }
      .meter {
        position: relative;
        height: 12px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(180, 200, 220, 0.3);
        overflow: hidden;
      }
      #hud-alarm-bar {
        height: 100%;
        width: 0%;
        background: #5ce1a6;
        border-radius: 6px;
        transition: width 0.08s linear, background 0.2s linear;
      }
      .hud-loot {
        color: #ffd66e;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .hud-small {
        font-size: 11px;
        font-weight: 700;
        color: #9fb4cc;
        white-space: nowrap;
      }
      .hud-objective {
        flex: 1 1 30%;
      }
      #hud-objective {
        font-size: 12px;
        font-weight: 700;
        color: #e6f0ff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hud-tools {
        flex: 0 0 auto;
      }
      #hud-emp {
        font-size: 12px;
        font-weight: 800;
        color: #67e8f9;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="wrap">
        <canvas id="game" width="1280" height="800" aria-label="VAULTLIGHT game canvas"></canvas>
        <div id="hud">
          <div id="hud-top">
            <div id="hud-status">
              <div class="hud-panel hud-alarm">
                <div class="hud-row">
                  <span class="hud-label">Alarm</span>
                  <span class="hud-value" id="hud-alarm-text">ALARM 0% · CALM</span>
                </div>
                <div class="meter"><div id="hud-alarm-bar"></div></div>
              </div>
              <div class="hud-panel">
                <div class="hud-loot" id="hud-loot">LOOT 0 GOLD</div>
                <div class="hud-small" id="hud-timer">TIME 00:00</div>
              </div>
              <div class="hud-panel hud-tools">
                <div class="hud-label">Tools</div>
                <div id="hud-emp">EMP 2/2 · COINS 3</div>
              </div>
              <div class="hud-panel hud-objective">
                <div class="hud-label">Objective</div>
                <div id="hud-objective">STEAL THE STAR OF MERIDIAN</div>
              </div>
            </div>
            <div id="hud-chips">
              <span class="hud-chip">PAINTINGS <b id="hud-paintings">0/3</b></span>
              <span class="hud-chip">CASES <b id="hud-cases">0/2</b></span>
              <span class="hud-chip hud-chip-star">STAR <b id="hud-star">NO</b></span>
              <span class="hud-chip">CLICK</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
